    <text x="72" y="190" font-size="66" font-weight="800" fill="url(#title)" letter-spacing="-1.5">FSL Powerhouse</text>
    <text x="74" y="230" font-size="22" fill="#dbeafe">Source-grounded Salesforce and Field Service</text>
    <text x="74" y="259" font-size="22" fill="#dbeafe">delivery for Claude Code</text>
    <g font-size="15" font-weight="600" fill="#e0f2fe">
      <rect x="72" y="286" width="104" height="30" rx="15" fill="#ffffff" fill-opacity="0.12"/>
      <text x="124" y="306" text-anchor="middle">11 agents</text>
      <rect x="186" y="286" width="96" height="30" rx="15" fill="#ffffff" fill-opacity="0.12"/>
      <text x="234" y="306" text-anchor="middle">15 skills</text>
      <rect x="292" y="286" width="170" height="30" rx="15" fill="#ffffff" fill-opacity="0.12"/>
      <text x="377" y="306" text-anchor="middle">live official docs</text>
    </g>
