<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="FSL Powerhouse: source-grounded Salesforce and Field Service delivery for Claude Code. Skills in four families: Field Service, Platform, Delivery and Knowledge.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a33"/>
      <stop offset="0.55" stop-color="#0b3a6b"/>
      <stop offset="1" stop-color="#0a5a8f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#round)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#grid)"/>
    <circle cx="1130" cy="20" r="220" fill="#38bdf8" fill-opacity="0.10"/>
    <circle cx="60" cy="380" r="180" fill="#f59e0b" fill-opacity="0.08"/>

    <!-- the skills, grouped by family -->
    <g transform="translate(724 38)">
      <rect width="508" height="286" rx="16" fill="#071a33" fill-opacity="0.45" stroke="#ffffff" stroke-opacity="0.16"/>
        <circle cx="24" cy="27" r="5" fill="#38bdf8"/>
        <text x="36" y="32" font-size="12" font-weight="700" letter-spacing="1.4" fill="#38bdf8">FIELD SERVICE</text>
        <rect x="18" y="42" width="103" height="26" rx="13" fill="#38bdf8"/>
        <text x="69.5" y="60" font-size="13" font-weight="600" text-anchor="middle" fill="#071a33">Architecture</text>
        <rect x="127" y="42" width="89" height="26" rx="13" fill="#38bdf8"/>
        <text x="171.5" y="60" font-size="13" font-weight="600" text-anchor="middle" fill="#071a33">Scheduling</text>
        <rect x="222" y="42" width="96" height="26" rx="13" fill="#38bdf8"/>
        <text x="270" y="60" font-size="13" font-weight="600" text-anchor="middle" fill="#071a33">Maintenance</text>
        <rect x="324" y="42" width="61" height="26" rx="13" fill="#38bdf8"/>
        <text x="354.5" y="60" font-size="13" font-weight="600" text-anchor="middle" fill="#071a33">Mobile</text>
        <rect x="391" y="42" width="89" height="26" rx="13" fill="#38bdf8"/>
        <text x="435.5" y="60" font-size="13" font-weight="600" text-anchor="middle" fill="#071a33">Operations</text>
        <circle cx="24" cy="93" r="5" fill="#4ade80"/>
        <text x="36" y="98" font-size="12" font-weight="700" letter-spacing="1.4" fill="#4ade80">PLATFORM</text>
        <rect x="18" y="108" width="48" height="26" rx="13" fill="#4ade80"/>
        <text x="42" y="126" font-size="13" font-weight="600" text-anchor="middle" fill="#071a33">Apex</text>
        <rect x="72" y="108" width="41" height="26" rx="13" fill="#4ade80"/>
        <text x="92.5" y="126" font-size="13" font-weight="600" text-anchor="middle" fill="#071a33">LWC</text>
        <rect x="119" y="108" width="48" height="26" rx="13" fill="#4ade80"/>
        <text x="143" y="126" font-size="13" font-weight="600" text-anchor="middle" fill="#071a33">Flow</text>
        <rect x="173" y="108" width="75" height="26" rx="13" fill="#4ade80"/>
        <text x="210.5" y="126" font-size="13" font-weight="600" text-anchor="middle" fill="#071a33">Security</text>
        <rect x="254" y="108" width="103" height="26" rx="13" fill="#4ade80"/>
        <text x="305.5" y="126" font-size="13" font-weight="600" text-anchor="middle" fill="#071a33">Architecture</text>
        <circle cx="24" cy="159" r="5" fill="#fbbf24"/>
        <text x="36" y="164" font-size="12" font-weight="700" letter-spacing="1.4" fill="#fbbf24">DELIVERY</text>
        <rect x="18" y="174" width="110" height="26" rx="13" fill="#fbbf24"/>
        <text x="73" y="192" font-size="13" font-weight="600" text-anchor="middle" fill="#071a33">Quality audit</text>
        <rect x="134" y="174" width="103" height="26" rx="13" fill="#fbbf24"/>
        <text x="185.5" y="192" font-size="13" font-weight="600" text-anchor="middle" fill="#071a33">Jira tickets</text>
        <rect x="243" y="174" width="110" height="26" rx="13" fill="#fbbf24"/>
        <text x="298" y="192" font-size="13" font-weight="600" text-anchor="middle" fill="#071a33">Release watch</text>
        <circle cx="24" cy="225" r="5" fill="#c4b5fd"/>
        <text x="36" y="230" font-size="12" font-weight="700" letter-spacing="1.4" fill="#c4b5fd">KNOWLEDGE</text>
        <rect x="18" y="240" width="82" height="26" rx="13" fill="#c4b5fd"/>
        <text x="59" y="258" font-size="13" font-weight="600" text-anchor="middle" fill="#071a33">Live docs</text>
        <rect x="106" y="240" width="151" height="26" rx="13" fill="#c4b5fd"/>
        <text x="181.5" y="258" font-size="13" font-weight="600" text-anchor="middle" fill="#071a33">Knowledge grounding</text>
